<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Tus entregas · Escalá</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<script src="/panel/vendor/marked.min.js"></script>
<script src="/panel/vendor/purify.min.js"></script>
<style>
/* Layout: lista de entregas a la izquierda, lectura a la derecha; una columna en el celular */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#0E1626; --muted:#556072; --line:#D9DEE7; --accent:#2F49F5; --accent-ink:#FFFFFF; --accent-soft:#E3E7FF; --ok:#0F9D6E;
  --f-display:"Bricolage Grotesque", system-ui, sans-serif; --f-body:"Figtree", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1020;--surface:#121a2e;--ink:#EEF1F8;--muted:#9AA5BA;--line:#243049;--accent:#7C8DFF;--accent-ink:#0B1020;--accent-soft:#1D2550;--ok:#34D399;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1020;--surface:#121a2e;--ink:#EEF1F8;--muted:#9AA5BA;--line:#243049;--accent:#7C8DFF;--accent-ink:#0B1020;--accent-soft:#1D2550;--ok:#34D399;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--ink);color:var(--bg)}
header .wrap{padding-block:22px;display:grid;gap:4px}
header small{opacity:.7}
header h1{margin:0;font:700 1.6rem var(--f-display)}
main .wrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;padding-block:24px}
@media (max-width:820px){main .wrap{grid-template-columns:1fr}}
.lista{display:grid;gap:8px;align-content:start}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:grid;gap:2px}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.item b{font-weight:600}
.item span{color:var(--muted);font-size:.85rem}
.lector{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;min-width:0}
.md{overflow-wrap:anywhere}
.md h1{font:700 1.5rem var(--f-display);margin-top:0}
.md h2{font:700 1.15rem var(--f-display);margin-top:1.5em}
.md table{border-collapse:collapse;display:block;overflow-x:auto;margin-block:12px}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.md pre{white-space:pre-wrap}
.coment{margin-top:24px;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:10px}
textarea{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:90px;width:100%}
button.btn{font:600 .95rem var(--f-body);padding:11px 16px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;justify-self:start}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.ok{color:var(--ok);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap"><small id="agencia">Escalá Growth Studio</small><h1 id="marca">Tus entregas</h1></div></header>
<main><div class="wrap">
  <nav class="lista" id="lista" aria-label="Entregas"></nav>
  <article class="lector" id="lector"><div class="empty">Cargando…</div></article>
</div></main>
<script>
(function(){
  var token = location.pathname.split('/').filter(Boolean).pop();
  var entregas = [], actual = null;
  var $ = function(s){ return document.querySelector(s); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function fecha(i){ try { return new Date(i).toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'}); } catch(e){ return i; } }
  function md(t){ return window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(t||'')) : '<pre>'+esc(t)+'</pre>'; }
  var NOMBRES = { contenido:'Calendario de contenido', creativos:'Anuncios', auditoria:'Auditoría de la tienda', reporte:'Reporte', diagnostico:'Plan de 90 días' };

  function lista(){
    if (!entregas.length) { $('#lista').innerHTML = ''; $('#lector').innerHTML = '<div class="empty">Todavía no hay entregas publicadas. Te avisamos cuando estén listas.</div>'; return; }
    $('#lista').innerHTML = entregas.map(function(e){ return '<button class="item" data-id="'+e.id+'" aria-current="'+(actual===e.id)+'"><b>'+esc(NOMBRES[e.tipo]||e.titulo)+'</b><span>'+fecha(e.fecha)+'</span></button>'; }).join('');
    document.querySelectorAll('[data-id]').forEach(function(b){ b.addEventListener('click', function(){ ver(b.getAttribute('data-id')); }); });
  }
  function ver(id){
    actual = id; lista();
    var e = entregas.find(function(x){ return x.id === id; });
    $('#lector').innerHTML = '<div class="md">'+md(e.markdown)+'</div>' +
      '<form class="coment" id="form"><b>¿Comentarios o cambios?</b>' +
      (e.comentarios.length ? e.comentarios.map(function(c){ return '<p class="muted">Tu comentario del '+fecha(c.fecha)+': '+esc(c.texto)+'</p>'; }).join('') : '') +
      '<label class="muted" for="txt">Tu equipo en la agencia lo recibe al instante.</label><textarea id="txt" required maxlength="1500"></textarea><button class="btn" type="submit">Enviar comentario</button><span id="estado" role="status"></span></form>';
    $('#form').addEventListener('submit', function(ev){
      ev.preventDefault();
      fetch('/api/portal/'+token+'/comentarios', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ entregaId: id, texto: $('#txt').value }) })
        .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error); return j; }); })
        .then(function(){ e.comentarios.push({ texto: $('#txt').value, fecha: new Date().toISOString() }); ver(id); $('#estado').innerHTML = '<span class="ok">Comentario enviado.</span>'; })
        .catch(function(err){ $('#estado').textContent = err.message; });
    });
  }
  fetch('/api/portal/'+token).then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error); return j; }); })
    .then(function(j){
      $('#agencia').textContent = j.agencia; $('#marca').textContent = j.marca + ' · tus entregas';
      document.title = j.marca + ' · ' + j.agencia;
      entregas = j.entregas; lista(); if (entregas.length) ver(entregas[0].id);
    })
    .catch(function(err){ $('#lector').innerHTML = '<div class="empty">'+esc(err.message)+'</div>'; });
})();
</script>
</body>
</html>
