<title>Kairos Creative Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra lateral con la cartera de clientes + área de trabajo con pestañas (ficha, agentes, entregas) */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunken:#E9EDF3; --ink:#0E1626; --muted:#556072; --line:#D9DEE7;
  --accent:#2F49F5; --accent-ink:#FFFFFF; --accent-soft:#E3E7FF;
  --ok:#0F7A57; --ok-soft:#DDF4EA; --warn:#9A4A06; --warn-soft:#FDF0DC; --bad:#B3261E; --bad-soft:#FBE3E4;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1020; --surface:#121A2E; --sunken:#0F1628; --ink:#EEF1F8; --muted:#9AA5BA; --line:#243049;
  --accent:#8D9BFF; --accent-ink:#0B1020; --accent-soft:#1D2550;
  --ok:#43D6A0; --ok-soft:#10362A; --warn:#F5B85A; --warn-soft:#3A2B0E; --bad:#FF8A80; --bad-soft:#3E1719; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#121A2E; --sunken:#0F1628; --ink:#EEF1F8; --muted:#9AA5BA; --line:#243049;
  --accent:#8D9BFF; --accent-ink:#0B1020; --accent-soft:#1D2550;
  --ok:#43D6A0; --ok-soft:#10362A; --warn:#F5B85A; --warn-soft:#3A2B0E; --bad:#FF8A80; --bad-soft:#3E1719; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800} h2{font-size:1.2rem;font-weight:700} h3{font-size:1rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.marca{display:flex;align-items:center;gap:10px;font:800 1.1rem var(--f-display)}
.marca small{font:500 .78rem var(--f-body);opacity:.7}
.top .estado{font:600 .72rem/1 var(--f-data);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.12)}

.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 56px)}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
aside{border-right:1px solid var(--line);background:var(--surface);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:860px){aside{border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}}
main{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.cont{max-width:1100px;margin:0 auto;display:grid;gap:18px}

.eyebrow{font:600 .7rem/1 var(--f-data);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lista-cli{display:grid;gap:4px}
.cli{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:9px;cursor:pointer}
.cli:hover{background:var(--sunken)}
.cli[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.cli span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli b{font:600 .7rem var(--f-data);color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.peligro{color:var(--bad);border-color:var(--bad-soft)}
.btn.chico{padding:6px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}
.fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0;align-content:start}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:1fr}}
label.campo{display:grid;gap:5px;font-weight:600;font-size:.86rem}
label.campo small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=email],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
textarea{min-height:90px;resize:vertical}
textarea.editor{min-height:420px;font:400 .88rem/1.5 var(--f-data)}

.chip{display:inline-block;font:600 .72rem/1 var(--f-data);padding:5px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neutro{background:var(--sunken);color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.aviso{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.aviso.info{background:var(--accent-soft)}
.err{color:var(--bad);font-size:.9rem}

.agentes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.agente{display:grid;gap:8px;align-content:start;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;cursor:pointer}
.agente:hover{border-color:var(--accent)}
.agente p{color:var(--muted);font-size:.88rem}
.agente .t{font:600 .7rem var(--f-data);color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:2px}
.kpi b{font:800 1.6rem var(--f-display)} .kpi span{color:var(--muted);font-size:.85rem}
.tabla-casos{overflow-x:auto}
.tabla-casos table{width:100%;border-collapse:collapse;font-size:.9rem}
.tabla-casos th{text-align:left;font:600 .7rem var(--f-data);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tabla-casos td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tabla-casos tbody tr{cursor:pointer}
.tabla-casos tbody tr:hover{background:var(--sunken)}
.chat{display:grid;gap:10px;max-height:460px;overflow:auto}
.msg{padding:10px 12px;border-radius:10px;font-size:.92rem;min-width:0}
.msg.yo{background:var(--accent-soft);justify-self:end;max-width:85%}
.msg.ia{background:var(--sunken)}
.bitacora{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bitacora li{display:grid;gap:3px;padding-bottom:10px;border-bottom:1px solid var(--line);justify-items:start}
.diff{font:400 .82rem/1.5 var(--f-data);background:var(--sunken);border-radius:8px;padding:10px;overflow-x:auto;max-height:600px;overflow-y:auto}
.diff .da{background:var(--ok-soft);color:var(--ok)} .diff .dq{background:var(--bad-soft);color:var(--bad);text-decoration:line-through} .diff .di{color:var(--muted)}
.proceso{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.proceso li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px}
.proceso li.actual{border-color:var(--accent);background:var(--accent-soft)}
.proceso .pn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:700 .9rem var(--f-data)}
.proceso .pt{display:grid;gap:3px;min-width:0}
.proceso .pt small{color:var(--muted);font-size:.84rem}
@media (max-width:560px){.proceso li{grid-template-columns:32px minmax(0,1fr)}.proceso li>.btn{grid-column:2;justify-self:start}}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.check input{margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}

.entregas{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.entregas{grid-template-columns:1fr}}
.ent{display:grid;gap:3px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);padding:11px 12px;border-radius:10px;cursor:pointer}
.ent[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ent small{color:var(--muted)}

.run{border:1px solid var(--accent);background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.pasos{display:grid;gap:4px;font-size:.9rem;margin:0;padding:0;list-style:none}
.pasos li::before{content:"○ ";color:var(--muted)}
.pasos li.hecho::before{content:"● ";color:var(--ok)}
.pasos li.activo::before{content:"◐ ";color:var(--accent)}
.preview{max-height:220px;overflow:auto;white-space:pre-wrap;font:400 .8rem/1.5 var(--f-data);background:var(--sunken);border-radius:8px;padding:10px;color:var(--muted)}

.doc{overflow-wrap:anywhere;line-height:1.6}
.doc h1{font-size:1.45rem;margin:.2em 0 .6em} .doc h2{font-size:1.15rem;margin:1.4em 0 .5em} .doc h3{font-size:1rem;margin:1.2em 0 .4em}
.doc p,.doc ul,.doc ol,.doc blockquote{margin:0 0 .8em}
.doc ul,.doc ol{padding-left:1.3em}
.doc blockquote{border-left:3px solid var(--line);padding-left:12px;color:var(--muted)}
.doc hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.doc code{font-family:var(--f-data);font-size:.88em;background:var(--sunken);padding:1px 5px;border-radius:5px}
.doc pre{background:var(--sunken);padding:12px;border-radius:8px;overflow-x:auto}
.doc .tabla{overflow-x:auto;margin:0 0 1em}
.doc table{border-collapse:collapse;min-width:100%;font-size:.9rem}
.doc th,.doc td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.doc th{background:var(--sunken)}
.calidad{display:grid;gap:6px;padding:12px 14px;border-radius:10px;background:var(--sunken);font-size:.9rem}
.calidad ul{margin:0;padding-left:1.2em}
.vacio{padding:36px 18px;text-align:center;display:grid;gap:12px;justify-items:center}
.vacio p{max-width:52ch;color:var(--muted)}
.miniaturas{display:flex;gap:6px;flex-wrap:wrap}
.miniaturas img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.toast{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:50;font-weight:600;max-width:calc(100vw - 32px)}
</style>

<div class="top"><div class="in">
  <div class="marca"><svg width="26" height="26" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" style="fill:var(--accent)"/><rect x="6" y="18" width="4" height="6" rx="1" style="fill:var(--accent-ink)"/><rect x="13" y="13" width="4" height="11" rx="1" style="fill:var(--accent-ink)"/><rect x="20" y="6" width="4" height="18" rx="1" style="fill:var(--accent-ink)"/></svg><span id="nombre-agencia">Kairos Creative</span> <small>Panel de agentes</small></div>
  <span class="estado" id="estado-con">Conectando…</span>
</div></div>

<div class="layout">
  <aside>
    <button class="btn pri" id="btn-nuevo" type="button">+ Nuevo cliente</button>
    <div class="eyebrow">Clientes</div>
    <nav class="lista-cli" id="lista-cli" aria-label="Clientes"><p class="muted">Cargando…</p></nav>
    <div style="flex:1"></div>
    <button class="btn" id="btn-inicio" type="button">Inicio</button>
    <button class="btn" id="btn-config" type="button">Datos de la agencia</button>
  </aside>
  <main><div class="cont" id="vista"></div></main>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function () {
"use strict";

/* ===================== Estado ===================== */
const S = {
  db: null, sample: null, downloads: null, limits: null,
  clientes: new Map(), entregas: new Map(), config: {},
  cargado: { clientes: false, entregas: false },
  vista: "inicio", clienteId: null, tab: "ficha", entregaId: null, agente: null,
  run: null, // { titulo, ctl, pasos:[], preview, clienteId, error }
  editando: false,
  mcp: null, user: null, yo: null, navegador: false, nombres: new Map(), equipo: [],
  bitacora: [], chat: { clienteId: null, turnos: [] }, filtro: "todos", comparar: false,
};
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ahora = () => new Date().toISOString();
const fecha = (iso) => { try { return new Date(iso).toLocaleDateString("es-AR", { day: "numeric", month: "short", year: "numeric" }); } catch { return ""; } };
const fechaHora = (iso) => { try { return new Date(iso).toLocaleString("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch { return ""; } };
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 3200); }
const guardarLocal = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const leerLocal = (k) => { try { return localStorage.getItem(k); } catch { return null; } };

/* ===================== Markdown seguro ===================== */
// Renderiza markdown escapando todo el HTML: el texto de Claude nunca se inserta como markup.
function inline(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const L = String(src || "").replace(/\r/g, "").split("\n");
  let h = "", i = 0;
  const celdas = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { let b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; h += "<pre><code>" + esc(b.join("\n")) + "</code></pre>"; continue; }
    const hm = l.match(/^(#{1,6})\s+(.*)$/);
    if (hm) { const n = Math.min(hm[1].length, 4); h += `<h${n}>${inline(hm[2])}</h${n}>`; i++; continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(l)) { h += "<hr>"; i++; continue; }
    if (/^\s*\|/.test(l) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}/.test(L[i + 1])) {
      const cab = celdas(l); i += 2; let filas = [];
      while (i < L.length && /^\s*\|/.test(L[i])) filas.push(celdas(L[i++]));
      h += '<div class="tabla"><table><thead><tr>' + cab.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" + filas.map((f) => "<tr>" + f.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
      continue;
    }
    if (/^\s*>/.test(l)) { let b = []; while (i < L.length && /^\s*>/.test(L[i])) b.push(L[i++].replace(/^\s*>\s?/, "")); h += "<blockquote>" + b.map(inline).join("<br>") + "</blockquote>"; continue; }
    if (/^\s*[-*+]\s+/.test(l)) { let b = []; while (i < L.length && /^\s*[-*+]\s+/.test(L[i])) b.push(L[i++].replace(/^\s*[-*+]\s+/, "")); h += "<ul>" + b.map((x) => "<li>" + inline(x) + "</li>").join("") + "</ul>"; continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { let b = []; while (i < L.length && /^\s*\d+[.)]\s+/.test(L[i])) b.push(L[i++].replace(/^\s*\d+[.)]\s+/, "")); h += "<ol>" + b.map((x) => "<li>" + inline(x) + "</li>").join("") + "</ol>"; continue; }
    if (!l.trim()) { i++; continue; }
    let b = [];
    while (i < L.length && L[i].trim() && !/^(#{1,6}\s|```|\s*[-*+]\s|\s*\d+[.)]\s|\s*>|\s*\|)/.test(L[i]) && !/^\s*(---|\*\*\*)\s*$/.test(L[i])) b.push(L[i++]);
    h += "<p>" + b.map(inline).join("<br>") + "</p>";
  }
  return h;
}

/* ===================== Conocimiento de la agencia ===================== */
const PLANES_BASE = [
  { id: "Auditoría Express", precio: 150, periodo: "pago único", incluye: "Diagnóstico, auditoría de marca y las 10 acciones de mayor impacto. Se descuenta del primer mes si contrata un plan." },
  { id: "Redes que crecen", precio: 450, periodo: "por mes", incluye: "Proceso completo de 8 pasos con foco en redes: estrategia, calendario mensual, 8 reels con guion, 8 carruseles, historias, comunidad y medición." },
  { id: "Tienda que convierte", precio: 650, periodo: "por mes", incluye: "Proceso completo de 8 pasos con foco en la tienda online: auditoría de conversión, mejoras quincenales, tests A/B, recuperación de carritos y medición." },
  { id: "Growth 360", precio: 1200, periodo: "por mes", incluye: "Proceso completo de 8 pasos: redes + tienda + gestión de pauta en Meta y TikTok con control de inversión, 12 creatividades por mes, reporte semanal y reunión quincenal." },
];
function planes() {
  const p = S.config.precios || {};
  return PLANES_BASE.map((x) => ({ ...x, precio: Number(p[x.id]) || x.precio }));
}
const nombreAgencia = () => S.config.nombre || "Kairos Creative";
const politica = () => (S.config.politica || "").trim();
function agenciaTexto() {
  const c = S.config;
  return `Sos parte del equipo de ${nombreAgencia()}, una agencia de marketing digital${c.ciudad ? ` de ${c.ciudad}` : ""} que trabaja bajo una lógica de marketing de resultados. Todo el trabajo lo ejecutan 8 agentes especializados, cada uno a cargo de un paso del proceso:
1. Ingreso y diagnóstico. 2. Investigación profunda (mercado, público, competencia). 3. Auditoría de marca (identidad, percepción, presencia digital y performance). 4. FODA + competencia. 5. Hipótesis con el método Dato → Señal → Hipótesis. 6. Plan de 90 días (objetivos SMART, calendario de contenidos y acciones, métricas). 7. Gestión de pauta y control de inversión. 8. Medición, engagement y resultados.
Cada paso usa lo que dejaron los anteriores: no se salta evidencia.

Planes (USD sin IVA; la inversión en pauta se paga aparte):
${planes().map((p) => `- ${p.id}: ${p.precio} USD ${p.periodo}. ${p.incluye}`).join("\n")}
Condiciones: compromiso inicial de 3 meses (plan de 90 días), después mes a mes.
${politica() ? `Política de devolución (texto oficial; citala tal cual, sin ampliarla ni resumirla con otras palabras): "${politica()}"` : "La política de devolución todavía no tiene texto oficial: no la menciones con detalles; si hace falta, decí que sus condiciones se acuerdan por escrito."}`;
}

/** Lo que dejaron los pasos anteriores: la última versión aprobada (o la más reciente) de cada uno. */
function contextoPrevio(c, tipos, max = 14000) {
  const partes = tipos.map((t) => {

  });
  return partes.join("\n\n");
}
function mejorEntrega(clienteId, tipo) {
  const es = [...S.entregas.values()].filter((e) => e.clienteId === clienteId && e.tipo === tipo && e.estado !== "descartada").sort((a, b) => (b.creado || "").localeCompare(a.creado || ""));
  return es.find((e) => e.estado === "aprobada") || es[0] || null;
}

// Solo está disponible para la cuenta dueña del panel; si no está, se trabaja con capturas y texto.
const NAV = "host:claude_browser";
let pestana = null, colaNav = Promise.resolve();
function textoResultado(r) {
  if (typeof r?.payload === "string") return r.payload;
  const t = (r?.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  return t || (r?.payload ? JSON.stringify(r.payload) : "");
}
function idPestana(r) {
  const p = r?.payload;
  const directo = p && typeof p === "object" ? (p.tabId ?? p.tab_id ?? p.id ?? p.tab?.id) : null;
  if (directo != null) return directo;
  const m = textoResultado(r).match(/tab\s*_?id["':\s]*(\d+)/i);
  return m ? Number(m[1]) : null;
}
function leerWeb(url) {
  // Una lectura a la vez: el navegador tiene una sola pestaña de trabajo.
  const tarea = colaNav.then(async () => {
    try {
      if (pestana == null) { const r = await S.mcp.callTool(NAV, "preview_start", { url }); pestana = idPestana(r); }
      else await S.mcp.callTool(NAV, "navigate", { url, tabId: pestana });
    } catch (e) {
      if (e?.code !== "tool_error") throw e;
      const r = await S.mcp.callTool(NAV, "preview_start", { url }); pestana = idPestana(r); // la pestaña se cerró: abrir otra
    }
    await espera(1800);
    const r = await S.mcp.callTool(NAV, "get_page_text", pestana != null ? { tabId: pestana } : {});
    const t = textoResultado(r).replace(/\n{3,}/g, "\n\n").trim();
    return t ? `URL: ${url}\n\n${t.slice(0, 12000)}` : `La página ${url} no devolvió texto.`;
  });
  colaNav = tarea.catch(() => {});
  return tarea;
}
function herramientasWeb(x) {
  let usos = 0;
  const limite = 24;
  const control = () => { if (++usos > limite) throw new Error("Se alcanzó el máximo de lecturas para esta tarea: escribí con lo que ya tenés."); };
  const fallo = (e) => { throw new Error(e?.code === "server_not_connected" ? "El navegador no está disponible: seguí con el material que tenés y marcá lo que falte como a validar." : e?.code === "cancelled" ? "La lectura no se aprobó." : `No se pudo leer (${e?.code || e?.message || "error"}).`); };
  return [
    { name: "buscar_en_web", description: "Busca en la web y devuelve el texto de la página de resultados (títulos, fragmentos y direcciones). Usalo para encontrar competidores, precios, reseñas, notas y tendencias. Después leé las páginas relevantes con leer_pagina.", inputSchema: { type: "object", properties: { consulta: { type: "string", description: "Búsqueda en lenguaje natural" } }, required: ["consulta"] },
      async execute(i) { control(); x.paso(`Buscando en la web: ${String(i.consulta).slice(0, 80)}`); try { return await leerWeb("https://duckduckgo.com/html/?q=" + encodeURIComponent(String(i.consulta))); } catch (e) { fallo(e); } } },
    { name: "leer_pagina", description: "Abre una página pública y devuelve su texto: el sitio o la tienda de la marca, sitios de competidores, fichas de producto, notas de prensa o reseñas.", inputSchema: { type: "object", properties: { url: { type: "string", description: "Dirección completa, con https://" } }, required: ["url"] },
      async execute(i) { const u = String(i.url || ""); if (!/^https?:\/\//i.test(u)) throw new Error("La dirección tiene que empezar con https://"); control(); x.paso(`Leyendo: ${u.slice(0, 90)}`); try { return await leerWeb(u); } catch (e) { fallo(e); } } },
  ];
}

/* ---------- Un agente: generar → revisar → corregir → guardar ---------- */
async function correrAgente(tipo, c, entrada) {
  const ag = AGENTES[tipo];
  const ctl = S.run.ctl;
  const x = {
    memo: {}, correcciones: "",
    pedido: entrada._pedido ? `\n\n<pedido_del_equipo>\nRehacé la entrega aplicando este pedido del equipo, sin perder lo que estaba bien:\n${entrada._pedido}\n</pedido_del_equipo>` : "",
    web: entrada.web && S.navegador ? null : false,
    paso(t) { S.run.pasos.forEach((p) => (p.hecho = true)); S.run.pasos.push({ t, hecho: false }); S.run.preview = ""; pintarRun(); },
    async pedir(prompt, { json = false, images, web = false } = {}) {
      const opts = { modelTier: "complex", cache: false, signal: ctl.signal, onText: ({ text }) => { S.run.preview = text.slice(-1600); pintarPreview(); } };
      if (images && images.length) opts.images = images;
      if (web && x.web !== false) opts.tools = herramientasWeb(x);
      if (json) return S.sample.json(prompt, opts);
      const r = await S.sample(prompt, opts);
      if (r.truncated) throw { code: "truncated", message: "La respuesta quedó cortada por longitud. Pedí menos piezas o menos material." };
      return r.text.trim();
    },
  };
  const rondas = Number(S.config.rondas ?? 1);
  let m, v, hist = [];
  x.correcciones = x.pedido;
  for (let r = 0; r <= rondas; r++) {
    x.paso(r ? `${ag.nombre}: corrigiendo según el control de calidad` : `${ag.nombre}: generando`);
    m = await ag.generar(c, entrada, x);
    v = await revisar(tipo, c, entrada, m, x);
    hist.push({ ronda: r + 1, aprobado: v.aprobado, puntaje: v.puntaje, correcciones: v.correcciones.slice(0, 8) });
    if (v.aprobado) break;
    x.correcciones = x.pedido + `\n\n<correcciones_del_revisor>\nTu entrega anterior no pasó el control de calidad. Corregí cada punto y mantené lo que estaba bien:\n${v.correcciones.map((t, i) => `${i + 1}. ${t}`).join("\n")}\n</correcciones_del_revisor>`;
  }
  x.paso(`${ag.nombre}: guardando`);
  const datos = Object.fromEntries(Object.entries(entrada).filter(([k]) => k !== "capturas" && !k.startsWith("_")));
  if (entrada.capturas?.length) datos.capturas = `${entrada.capturas.length} captura(s)`;
  const ref = S.db.collection("entregas").doc();
  const doc = {
    clienteId: c.id, tipo, titulo: tituloDe(m, ag.nombre), markdown: m, estado: v.aprobado ? "lista" : "revisar",
    calidad: { aprobado: v.aprobado, puntaje: v.puntaje, rondas: hist.length, correcciones: v.correcciones.slice(0, 8), historial: hist },
    entrada: datos, creado: ahora(), autorId: S.yo?.id || null, versionDe: entrada._versionDe || null,
  };
  await ref.set(doc);
  S.entregas.set(ref.id, { id: ref.id, ...doc });
  anotar(c.id, "Sistema", `Se generó "${doc.titulo}" · calidad ${v.puntaje}/100${v.aprobado ? "" : " (con observaciones)"}`);
  return { id: ref.id, aprobado: v.aprobado };
}

async function ejecutar(tipo, c, entrada) {
  S.run = { titulo: AGENTES[tipo].nombre, clienteId: c.id, ctl: new AbortController(), pasos: [], preview: "", error: null };
  render();
  try {
    const r = await correrAgente(tipo, c, entrada);
    S.run = null; S.agente = null; S.tab = "entregas"; S.entregaId = r.id; S.editando = false;
    toast(r.aprobado ? "Entrega lista y aprobada por el control de calidad" : "Entrega lista: revisá las observaciones del control de calidad");
  } catch (err) {
    if (err?.code === "cancelled") { S.run = null; toast("Detenido"); } else S.run.error = copia(err);
  }
  render();
}

const CADENA = ["diagnostico", "investigacion", "auditoria", "foda", "hipotesis"];
async function ejecutarCadena(c, e) {
  S.run = { titulo: "Pasos 1 a 5 seguidos", clienteId: c.id, ctl: new AbortController(), pasos: [], preview: "", error: null };
  render();
  const entradas = {
    diagnostico: { notas: e.notas, metricas: e.metricas },
    investigacion: { competidores: e.competidores, mercado: "", web: e.web },
    auditoria: { capturas: e.capturas, metricas: e.metricas, texto: "", web: e.web },
    foda: {}, hipotesis: {},
  };
  let hechos = 0;
  try {
    for (const t of CADENA) { await correrAgente(t, S.clientes.get(c.id) || c, entradas[t]); hechos++; }
    S.run = null; S.agente = null; S.tab = "agentes";
    toast("Pasos 1 a 5 listos. Revisalos y aprobalos antes del plan de 90 días.");
  } catch (err) {
    if (err?.code === "cancelled") { S.run = null; toast(`Detenido después de ${hechos} paso(s)`); }
    else S.run.error = `Se completaron ${hechos} de 5 pasos. En el paso ${hechos + 1} (${AGENTES[CADENA[hechos]].nombre}): ${copia(err)}`;
  }
  render();
}

/* ---------- Bitácora del caso ---------- */
const TIPOS_BITACORA = ["Nota", "Llamada", "WhatsApp", "Email", "Reunión", "Pedido del cliente", "Decisión"];
async function anotar(clienteId, tipo, texto) {
  if (!S.db || !texto) return;
  try {
    await S.db.collection(`clientes/${clienteId}/bitacora`).doc().set({ fecha: ahora(), tipo, texto: String(texto).slice(0, 2000), autorId: S.yo?.id || null });
    const cambio = { ultimaActividad: ahora() };
    if (tipo !== "Sistema" && tipo !== "Nota" && tipo !== "Decisión") cambio.ultimoContacto = ahora();
    await S.db.doc("clientes/" + clienteId).update(cambio);
  } catch { /* la bitácora no debe frenar el trabajo */ }
}
let desuscribirBitacora = null, bitacoraDe = null;
function seguirBitacora(clienteId) {
  if (bitacoraDe === clienteId || !S.db) return;
  desuscribirBitacora?.(); bitacoraDe = clienteId; S.bitacora = [];
  desuscribirBitacora = S.db.collection(`clientes/${clienteId}/bitacora`).orderBy("fecha", "desc").limit(200).onSnapshot((snap) => {
    S.bitacora = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    resolverNombres(S.bitacora.map((b) => b.autorId));
    if (!ocupado() && S.tab === "caso") render();
  }, () => {});
}

/* ---------- Personas ---------- */
const nombre = (id) => (id ? S.nombres.get(id) || "Alguien del equipo" : "Sin asignar");
async function resolverNombres(ids) {
  if (!S.user) return;
  const faltan = [...new Set(ids.filter((i) => i && !S.nombres.has(i)))];
  if (!faltan.length) return;
  try {
    const ps = await S.user.profiles(faltan);
    for (const i of faltan) S.nombres.set(i, ps[i]?.name || "Alguien del equipo");
    if (!ocupado()) render(); else pintarLista();
  } catch {}
}

/* ---------- Asistente del caso ---------- */

  const otras = HERRAMIENTAS.map((t) => mejorEntrega(c.id, t)).filter(Boolean).map((e) => `<entrega tipo="${AGENTES[e.tipo].nombre}" fecha="${fecha(e.creado)}" estado="${e.estado}">\n${e.markdown.slice(0, 2500)}\n</entrega>`).join("\n");
  const bit = (bitacoraDe === c.id ? S.bitacora : []).slice(0, 80).reverse().map((b) => `- ${fechaHora(b.fecha)} · ${b.tipo} · ${nombre(b.autorId)}: ${b.texto}`).join("\n");

<estado_del_caso>

</estado_del_caso>
<proceso>
${pasos}
</proceso>
${otras ? `<otras_entregas>\n${otras}\n</otras_entregas>` : ""}
<bitacora>
${bit || "(vacía)"}
</bitacora>`;
}
async function preguntarCaso(c, pregunta, onText, signal) {
  const previas = (S.chat.clienteId === c.id ? S.chat.turnos : []).slice(-6).map((t) => `${t.rol === "yo" ? "Pregunta" : "Respuesta"}: ${t.texto}`).join("\n\n");
  const prompt = `${agenciaTexto()}

Tu rol: asistente de casos de ${nombreAgencia()}. Ayudás a cualquier persona del equipo, incluso a alguien que nunca vio este caso, a saber en qué está, a responder consultas del cliente y a avanzar sin quedarse estancado. ${ESTILO}
${DATOS}

Reglas:

- Si algo no está en las fuentes, decilo y explicá dónde averiguarlo o a quién preguntarle. Nunca lo supongas.

/* ---------- Comparar versiones ---------- */
function diferencias(a, b) {
  const A = String(a).split("\n").slice(0, 900), B = String(b).split("\n").slice(0, 900);
  const n = A.length, m = B.length, T = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) T[i][j] = A[i] === B[j] ? T[i + 1][j + 1] + 1 : Math.max(T[i + 1][j], T[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (A[i] === B[j]) { out.push([" ", A[i]]); i++; j++; } else if (T[i + 1][j] >= T[i][j + 1]) out.push(["-", A[i++]]); else out.push(["+", B[j++]]); }
  while (i < n) out.push(["-", A[i++]]); while (j < m) out.push(["+", B[j++]]);
  return out;
}

    S.chat.turnos.push({ rol: "yo", texto: visible || q }); S.chat.pensando = true; S.chat.vivo = ""; render();
    try {
      const t = await preguntarCaso(S.clientes.get(c.id) || c, q, ({ text }) => { S.chat.vivo = text; const v = $("#chat-vivo"); if (v) v.innerHTML = md(text); });
      S.chat.turnos.push({ rol: "ia", texto: t });
    } catch (err) { S.chat.turnos.push({ rol: "ia", texto: copia(err) }); }
    S.chat.pensando = false; S.chat.vivo = ""; render();
    const ch = $("#chat"); if (ch) ch.scrollTop = ch.scrollHeight;
  };

    if (!t) { $("#ent-err").textContent = "Escribí qué hay que cambiar."; return; }
    if ($("#como-leccion").checked) await guardarCliente(c.id, { lecciones: [...(c.lecciones || []), { texto: `${AGENTES[e.tipo].nombre}: ${t}`.slice(0, 600), fecha: ahora() }].slice(-40) }).catch(() => {});
    await guardarEntrega(e.id, { estado: "descartada", decisionEquipo: "cambios", decididoPor: S.yo?.id || null }).catch(() => {});
    anotar(c.id, "Decisión", `Pedido de cambios en "${e.titulo}": ${t}`);
    const entrada = { ...(e.entrada || {}), _versionDe: e.id };
    delete entrada.capturas;
    if (e.tipo === "auditoria") entrada.texto = `${entrada.texto || ""}\n\nVersión anterior de la auditoría (corregila; no tenés las capturas de nuevo):\n${e.markdown}`.trim();
    entrada._pedido = t;
    await ejecutar(e.tipo, S.clientes.get(c.id) || c, entrada);
  });
  $("#copiar")?.addEventListener("click", () => {
    const fin = () => toast("Texto copiado");
    try { navigator.clipboard.writeText(e.markdown).then(fin, () => seleccionar()); } catch { seleccionar(); }
    function seleccionar() { const r = document.createRange(); r.selectNodeContents($("#doc")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texto seleccionado: copialo con Ctrl+C"); }
  });
  $("#dl-md")?.addEventListener("click", () => descargar(`${slug(c.marca)}-${e.tipo}-${e.creado.slice(0, 10)}.md`, e.markdown));
  $("#dl-html")?.addEventListener("click", () => descargar(`${slug(c.marca)}-${e.tipo}-${e.creado.slice(0, 10)}.html`, documentoCliente(c, e)));
}
const slug = (s) => String(s || "cliente").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
async function descargar(nombre, data) {
  if (!S.downloads) { toast("Las descargas no están disponibles en esta vista. Usá Copiar texto."); return; }
  try { await S.downloads.save({ filename: nombre, data }); toast("Archivo descargado"); }
  catch (err) { if (err?.code !== "declined") toast("No se pudo descargar. Usá Copiar texto."); }
}
function documentoCliente(c, e) {
  const ag = nombreAgencia();
  const contacto = [S.config.whatsapp, S.config.email].filter(Boolean).map(esc).join(" · ");
  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(e.titulo)}</title>
<style>body{font:16px/1.65 Georgia,"Times New Roman",serif;color:#1b2333;max-width:820px;margin:0 auto;padding:40px 24px}header{border-bottom:2px solid #1b2333;padding-bottom:14px;margin-bottom:28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:Helvetica,Arial,sans-serif}header b{font-size:18px}header span{color:#5a6475;font-size:14px}h1,h2,h3{font-family:Helvetica,Arial,sans-serif;line-height:1.2}h1{font-size:28px}h2{font-size:20px;margin-top:32px}table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0}th,td{border:1px solid #c9d0db;padding:6px 9px;text-align:left;vertical-align:top}th{background:#eef1f6}blockquote{border-left:3px solid #c9d0db;margin-left:0;padding-left:14px;color:#5a6475}code{background:#eef1f6;padding:1px 5px;border-radius:4px}footer{margin-top:40px;border-top:1px solid #c9d0db;padding-top:12px;color:#5a6475;font:13px Helvetica,Arial,sans-serif}@media print{body{padding:0}}</style></head>
<body><header><b>${esc(ag)}</b><span>Preparado para ${esc(c.marca)} · ${fecha(e.creado)}</span></header>${md(e.markdown)}<footer>${esc(ag)}${contacto ? " · " + contacto : ""}</footer></body></html>`;
}

function vistaConfig() {
  const c = S.config, p = c.precios || {};
  return `<div><span class="eyebrow">Configuración</span><h1>Datos de la agencia</h1><p class="muted">Los agentes usan estos datos y precios en todo lo que escriben.</p></div>
  <form class="card" id="form-conf"><div class="form">
    <label class="campo">Nombre de la agencia<input type="text" id="c-nombre" value="${esc(c.nombre || "Kairos Creative")}"></label>
    <label class="campo">Ciudad<input type="text" id="c-ciudad" value="${esc(c.ciudad || "Buenos Aires")}"></label>
    <label class="campo">WhatsApp<input type="text" id="c-whatsapp" value="${esc(c.whatsapp || "")}"></label>
    <label class="campo">Email<input type="text" id="c-email" value="${esc(c.email || "")}"></label>
    ${PLANES_BASE.map((x, i) => `<label class="campo">Precio ${esc(x.id)} (USD)<input type="number" id="c-p${i}" value="${esc(p[x.id] || x.precio)}"></label>`).join("")}
    <label class="campo full">Política de devolución (texto oficial)<small>Los agentes la citan palabra por palabra y nunca la amplían. Conviene que defina: qué resultado se mide (métrica, línea base y meta), en qué plazo, qué significa "seguir el plan al pie de la letra" (los compromisos del plan de 90 días), qué se devuelve (por ejemplo, los honorarios de un período, nunca la inversión en pauta) y cómo se pide. Revisala con un abogado o contador antes de usarla.</small><textarea id="c-politica" placeholder="Escribí acá el texto exacto de tu política.">${esc(c.politica || "")}</textarea></label>
    <label class="campo">Rondas de autocorrección<small>Cuántas veces se corrige sola una entrega que no pasa el control de calidad.</small><select id="c-rondas">${[0, 1, 2].map((n) => `<option${Number(c.rondas ?? 1) === n ? " selected" : ""}>${n}</option>`).join("")}</select></label>
  </div><div class="fila"><button class="btn pri" type="submit">Guardar</button></div></form>`;
}
function enlazarConfig() {
  $("#form-conf").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const datos = { nombre: $("#c-nombre").value.trim(), ciudad: $("#c-ciudad").value.trim(), whatsapp: $("#c-whatsapp").value.trim(), email: $("#c-email").value.trim(), rondas: Number($("#c-rondas").value), politica: $("#c-politica").value.trim(), precios: Object.fromEntries(PLANES_BASE.map((x, i) => [x.id, Number($("#c-p" + i).value) || x.precio])), actualizado: ahora() };
    try { await S.db.doc("config/agencia").set(datos); toast("Datos guardados"); } catch { toast("No se pudo guardar."); }
  });
}

/* ===================== Arranque ===================== */
// Mientras hay un formulario abierto o un agente trabajando, las actualizaciones de datos
// solo refrescan la lista lateral: así no se borra lo que estás escribiendo.
const ocupado = () => Boolean(S.run || S.editando || S.agente || S.vista === "nuevo" || S.vista === "config");
$("#btn-nuevo").addEventListener("click", () => { if (S.run && !S.run.error) return toast("Esperá a que termine el agente."); S.vista = "nuevo"; render(); });
$("#btn-inicio").addEventListener("click", () => { if (S.run && !S.run.error) return toast("Esperá a que termine el agente."); S.vista = "inicio"; render(); });
$("#btn-config").addEventListener("click", () => { if (S.run && !S.run.error) return toast("Esperá a que termine el agente."); S.vista = "config"; render(); });
window.addEventListener("beforeunload", (ev) => { if (S.run && !S.run.error) { ev.preventDefault(); ev.returnValue = ""; } });

async function iniciar() {
  render();
  const claude = window.claude;
  if (!claude?.use) { $("#estado-con").textContent = "Sin conexión a claude.ai"; S.cargado.clientes = true; render(); return; }
  const [db, sample, downloads, mcp, user] = await Promise.all([claude.use("db"), claude.use("sample"), claude.use("downloads"), claude.use("mcp"), claude.use("user")]);
  S.db = db; S.sample = sample; S.downloads = downloads; S.mcp = mcp; S.user = user;
  S.filtro = leerLocal("kairos-filtro") || "todos";
  if (user) user.me().then((m) => { S.yo = { id: m?.id || null, nombre: m?.name || "" }; if (S.yo.id) S.nombres.set(S.yo.id, S.yo.nombre || "Vos"); if (!ocupado()) render(); }).catch(() => {});
  // El navegador de Claude solo aparece en la app de escritorio, para la cuenta dueña del panel.
  if (mcp) mcp.listTools().then((r) => { S.navegador = (r?.servers || []).some((x) => x.server === NAV && (x.tools || []).length); if (!ocupado()) render(); }).catch(() => {});
  if (sample?.limits) S.limits = await sample.limits().catch(() => null);
  $("#estado-con").textContent = db ? (sample ? "Agentes listos" : "Agentes no disponibles") : "Sin almacenamiento";
  if (!db) { S.cargado.clientes = true; render(); return; }
  const lento = setTimeout(() => { if (!S.cargado.clientes) { $("#estado-con").textContent = "Esperando datos…"; } }, 10000);
  db.collection("clientes").onSnapshot((snap) => {
    S.clientes = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
    S.cargado.clientes = true; clearTimeout(lento);
    resolverNombres([...S.clientes.values()].map((c) => c.responsableId));
    if (S.clienteId) seguirBitacora(S.clienteId);
    if (!ocupado()) render(); else pintarLista();
  }, () => { $("#estado-con").textContent = "Sin acceso a los datos"; });
  db.collection("entregas").onSnapshot((snap) => {
    S.entregas = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
    S.cargado.entregas = true;
    if (!ocupado()) render(); else pintarLista();
  }, () => {});
  db.doc("config/agencia").onSnapshot((d) => {
    S.config = d.exists ? d.data() : {};
    $("#nombre-agencia").textContent = nombreAgencia();
    if (!ocupado()) render();
  }, () => {});
}
iniciar();
})();
</script>
