<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Kairos</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<script src="/panel/vendor/marked.min.js"></script>
<script src="/panel/vendor/purify.min.js"></script>
<style>
/* Layout: barra superior + pestañas; tablas densas y un visor lateral de resultados */
/* Identidad Kairos (mismos tokens que el panel en claude.ai): Helvetica Neue, cinco azules (#101820 · #354B60 · #7394AC · #B8D0DE · #F0F5F7),
   fondo con resplandor helado y superficies de vidrio con borde fino. Oscuro primero; variante clara helada. */
:root{
  --k-noche:#101820; --k-acero:#354B60; --k-niebla:#7394AC; --k-hielo:#B8D0DE; --k-nieve:#F0F5F7;
  --bg:#0C141B; --surface:rgba(240,245,247,.055); --sunken:rgba(240,245,247,.035); --solid:#15212C;
  --ink:#F0F5F7; --muted:#9DB4C4; --line:rgba(184,208,222,.16); --line-fuerte:rgba(184,208,222,.32);
  --accent:#B8D0DE; --accent-ink:#101820; --accent-soft:rgba(115,148,172,.2);
  --pri-a:#F0F5F7; --pri-b:#B8D0DE; --pri-ink:#101820; --brillo:rgba(184,208,222,.45);
  --titulo-a:#F0F5F7; --titulo-b:#9EC0D6;
  --glow-1:rgba(184,208,222,.34); --glow-2:rgba(115,148,172,.42); --glow-3:rgba(53,75,96,.55);
  --sombra:0 18px 40px -22px rgba(0,0,0,.7); --filo:inset 0 1px 0 rgba(240,245,247,.07);
  --ok:#7FD8B4; --ok-soft:rgba(127,216,180,.13); --warn:#F2C887; --warn-soft:rgba(242,200,135,.13); --bad:#FF9B93; --bad-soft:rgba(255,155,147,.14);
  --f-display:"Helvetica Neue","Inter",Helvetica,Arial,sans-serif;
  --f-body:"Helvetica Neue","Inter",Helvetica,Arial,sans-serif;
  --f-data:"Helvetica Neue","Inter",Helvetica,Arial,sans-serif;
  --f-code:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:18px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EAF1F5; --surface:rgba(255,255,255,.62); --sunken:rgba(53,75,96,.05); --solid:#FFFFFF;
  --ink:#101820; --muted:#466075; --line:rgba(53,75,96,.14); --line-fuerte:rgba(53,75,96,.3);
  --accent:#354B60; --accent-ink:#F0F5F7; --accent-soft:rgba(115,148,172,.18);
  --pri-a:#354B60; --pri-b:#101820; --pri-ink:#F0F5F7; --brillo:rgba(53,75,96,.35);
  --titulo-a:#101820; --titulo-b:#466A86;
  --glow-1:rgba(255,255,255,.95); --glow-2:rgba(184,208,222,.75); --glow-3:rgba(115,148,172,.35);
  --sombra:0 18px 40px -24px rgba(16,24,32,.35); --filo:inset 0 1px 0 rgba(255,255,255,.8);
  --ok:#0E6B4C; --ok-soft:rgba(14,107,76,.1); --warn:#8A4A07; --warn-soft:rgba(178,104,16,.12); --bad:#A8271F; --bad-soft:rgba(168,39,31,.1);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EAF1F5; --surface:rgba(255,255,255,.62); --sunken:rgba(53,75,96,.05); --solid:#FFFFFF;
  --ink:#101820; --muted:#466075; --line:rgba(53,75,96,.14); --line-fuerte:rgba(53,75,96,.3);
  --accent:#354B60; --accent-ink:#F0F5F7; --accent-soft:rgba(115,148,172,.18);
  --pri-a:#354B60; --pri-b:#101820; --pri-ink:#F0F5F7; --brillo:rgba(53,75,96,.35);
  --titulo-a:#101820; --titulo-b:#466A86;
  --glow-1:rgba(255,255,255,.95); --glow-2:rgba(184,208,222,.75); --glow-3:rgba(115,148,172,.35);
  --sombra:0 18px 40px -24px rgba(16,24,32,.35); --filo:inset 0 1px 0 rgba(255,255,255,.8);
  --ok:#0E6B4C; --ok-soft:rgba(14,107,76,.1); --warn:#8A4A07; --warn-soft:rgba(178,104,16,.12); --bad:#A8271F; --bad-soft:rgba(168,39,31,.1);
  color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--ink);color:var(--bg)}
header.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
header.top b{font:700 1.2rem var(--f-display)}
.tag{font:600 .72rem/1 var(--f-data);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-block:20px 18px;overflow-x:auto}
nav.tabs button{font:600 .95rem var(--f-body);background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.btn{font:600 .9rem/1 var(--f-body);padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:960px){.grid{grid-template-columns:1fr}}
.grid.ancho{grid-template-columns:1fr}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font:600 .72rem var(--f-data);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.sel td{background:var(--accent-soft)}
tbody tr{cursor:pointer}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.chip{display:inline-block;font:600 .75rem/1 var(--f-data);padding:5px 8px;border-radius:999px;white-space:nowrap}
.chip.listo,.chip.caliente,.chip.cliente{background:var(--ok-soft);color:var(--ok)}
.chip.trabajando,.chip.en_cola,.chip.tibio,.chip.propuesta,.chip.contactado{background:var(--warn-soft);color:var(--warn)}
.chip.error,.chip.frio,.chip.perdido{background:var(--bad-soft);color:var(--bad)}
.chip.nuevo{background:var(--accent-soft);color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.viewer h2{font:700 1.15rem var(--f-display);margin:0 0 10px}
.md{overflow-wrap:anywhere}
.md h1{font:700 1.4rem var(--f-display)} .md h2{font:700 1.15rem var(--f-display);margin-top:1.4em} .md h3{font-size:1rem}
.md table{margin-block:10px;display:block;overflow-x:auto} .md td,.md th{border:1px solid var(--line)}
.md pre{white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.launch{display:grid;gap:14px}
form.launch label{display:grid;gap:5px;font-weight:600;font-size:.88rem}
input,select,textarea{font:400 .95rem var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:110px;resize:vertical}
.hint{font-size:.82rem;color:var(--muted);font-weight:400}
.login{max-width:420px;margin:12vh auto 0;display:grid;gap:14px}
.err{color:var(--bad);font-size:.9rem}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font:700 1.6rem var(--f-display)}
.kpi span{font-size:.82rem;color:var(--muted)}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip.requiere_revision,.chip.esperando_reintento,.chip.pausado_presupuesto{background:var(--warn-soft);color:var(--warn)}
.chip.aprobado{background:var(--ok-soft);color:var(--ok)}
.chip.rechazado,.chip.revisando{background:var(--accent-soft);color:var(--ink)}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-block:12px;background:var(--bg)}
.box ul{margin:6px 0 0;padding-left:18px}
.toggle-row{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
.toggle-row label{display:flex;gap:6px;align-items:center;font-weight:500}
.toggle-row input{width:auto}

/* ===== Capa de identidad Kairos ===== */
body{background:radial-gradient(60% 55% at 0% 70%,var(--glow-1),transparent 62%),radial-gradient(55% 45% at 30% 108%,var(--glow-2),transparent 65%),radial-gradient(60% 60% at 100% 0%,var(--glow-3),transparent 70%),var(--bg);background-attachment:fixed;font-family:var(--f-body);letter-spacing:-.003em;min-height:100vh}
h1,h2,h3,header.top b,header h1,.viewer h2,.md h1,.md h2,.kpi b{font-family:var(--f-display)!important;font-weight:500!important;letter-spacing:-.025em}
header.top,body>header{background:color-mix(in srgb,var(--bg) 55%,transparent);color:var(--ink);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
body>header h1{background:linear-gradient(100deg,var(--titulo-a) 35%,var(--titulo-b));-webkit-background-clip:text;background-clip:text;color:transparent}
body>header small{color:var(--muted);opacity:1;letter-spacing:.14em;text-transform:uppercase;font-size:.72rem}
.tag{font:500 .7rem/1 var(--f-body);letter-spacing:.12em;border-radius:999px;padding:7px 11px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.card,.kpi,.item,.lector,.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:var(--filo),var(--sombra)}
.item{transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .2s}
.item:hover{transform:translateY(-2px);border-color:var(--line-fuerte)}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:var(--filo),0 0 0 4px var(--accent-soft)}
.kpi b{font-size:clamp(1.6rem,1.3rem + 1vw,2.1rem)!important;background:linear-gradient(100deg,var(--titulo-a),var(--titulo-b));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.btn,button.btn{font:500 .92rem/1 var(--f-body);border-radius:999px;border:1px solid var(--line-fuerte);background:var(--surface);color:var(--ink);padding:10px 16px;box-shadow:var(--filo);transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--accent);box-shadow:var(--filo),0 10px 26px -14px var(--brillo)}
.btn.primary,.coment button.btn{background:linear-gradient(135deg,var(--pri-a),var(--pri-b));color:var(--pri-ink);border-color:transparent;box-shadow:0 8px 26px -12px var(--brillo),inset 0 1px 0 rgba(255,255,255,.45)}
nav.tabs{border-bottom:0;gap:6px;padding:4px;background:var(--sunken);border:1px solid var(--line);border-radius:999px;width:max-content;max-width:100%}
nav.tabs button{border-radius:999px;border-bottom:0;font-weight:500;padding:8px 16px}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-fuerte),var(--filo)}
input,select,textarea{border-radius:12px;border:1px solid var(--line);background:var(--sunken);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
select option{background:var(--solid);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
th{font:500 .68rem var(--f-body)!important;letter-spacing:.14em;color:var(--muted)}
th,td,.md td,.md th{border-color:var(--line)}
tbody tr{transition:background .2s} tbody tr:hover td{background:var(--accent-soft)}
.chip{font:500 .72rem/1 var(--f-body);padding:5px 10px}
.num{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.md pre,.md code{font-family:var(--f-code)}
.coment{border-color:var(--line)}
::selection{background:var(--accent-soft)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.kpi,.item,.lector,.box,header.top,body>header{background:var(--solid)}}
@media (prefers-reduced-motion: reduce){.btn,.item{transition:none}.btn:hover,.item:hover{transform:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><b>Kairos Creative · Panel de agentes</b><span class="row"><span class="tag" id="modo">—</span><button class="btn" id="salir" type="button" hidden>Salir</button></span></div></header>

<main class="wrap">
  <section class="card login" id="login">
    <h2 style="margin:0;font-family:var(--f-display)">Ingresar al panel</h2>
    <p class="muted" style="margin:0">Usá el ADMIN_TOKEN configurado en el servidor (si no lo configuraste, el servidor muestra uno temporal al arrancar).</p>
    <form id="login-form" class="launch"><label>Token<input id="token" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">Entrar</button><span class="err" id="login-err"></span></form>
  </section>

  <div id="app" hidden>
    <div class="kpis" id="kpis"></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="cartera" aria-selected="true">Cartera</button>
      <button role="tab" data-tab="leads" aria-selected="false">Leads</button>
      <button role="tab" data-tab="atencion" aria-selected="false">Requieren atención <span class="chip error" id="n-atencion">0</span></button>
      <button role="tab" data-tab="jobs" aria-selected="false">Trabajos de agentes</button>
      <button role="tab" data-tab="clientes" aria-selected="false">Clientes</button>
      <button role="tab" data-tab="lanzar" aria-selected="false">Lanzar agente</button>
      <button role="tab" data-tab="chats" aria-selected="false">Conversaciones</button>
    </nav>

    <div class="grid ancho" id="grid">
      <section class="card" style="padding:0">
        <div data-panel="cartera" class="table-wrap"></div>
        <div data-panel="leads" class="table-wrap" hidden></div>
        <div data-panel="atencion" class="table-wrap" hidden></div>
        <div data-panel="jobs" hidden>
          <div class="row" style="padding:12px">
            <select id="f-cliente" style="max-width:220px" aria-label="Filtrar por cliente"></select>
            <select id="f-estado" style="max-width:220px" aria-label="Filtrar por estado">
              <option value="">Todos los estados</option><option value="en_cola,trabajando,revisando,esperando_reintento,pausado_presupuesto">En curso</option>
              <option value="listo">Listos</option><option value="aprobado">Aprobados</option><option value="requiere_revision,error">Requieren atención</option>
            </select>
            <span class="hint" id="f-total"></span>
          </div>
          <div class="table-wrap" id="tabla-jobs"></div>
        </div>
        <div data-panel="clientes" hidden>
          <div class="table-wrap" id="tabla-clientes"></div>
          <form class="launch" id="nuevo-cliente" style="padding:20px;border-top:1px solid var(--line)">
            <b>Nuevo cliente</b>
            <label>Marca<input id="c-marca" required></label>
            <label>Rubro<input id="c-rubro" placeholder="Indumentaria femenina"></label>
            <label>URL de la tienda<input id="c-url" placeholder="https://"></label>
            <label>Redes<input id="c-redes" placeholder="@marca"></label>
            <label>Público<input id="c-publico"></label>
            <label>Tono de marca<input id="c-tono"></label>
            <label>Productos destacados<textarea id="c-productos"></textarea></label>
            <label>Objetivo<input id="c-objetivo"></label>
            <button class="btn primary" type="submit">Crear cliente</button>
            <span class="err" id="c-err"></span>
          </form>
        </div>
        <div data-panel="chats" class="table-wrap" hidden></div>
        <div data-panel="lanzar" hidden style="padding:20px">
          <form class="launch" id="launch">
            <label>Agente<select id="l-tipo"></select></label>
            <label>Cliente (opcional)<select id="l-cliente"></select><span class="hint">Con un cliente, el agente usa su brief y sus lecciones, y completa los datos que falten.</span></label>
            <div id="l-campos" class="launch"></div>
            <button class="btn primary" type="submit">Lanzar</button>
            <span class="err" id="l-err"></span>
          </form>
        </div>
      </section>
      <section class="card viewer" id="viewer"><div class="empty">Elegí un lead o un trabajo para ver el detalle.</div></section>
    </div>
  </div>
</main>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var TOKEN = '';
  try { TOKEN = localStorage.getItem('escala-admin') || ''; } catch(e){}
  var tab = 'cartera', seleccion = null, datos = { leads: [], jobs: [], chats: [], clientes: [], metricas: null, cartera: null, filtrados: null };

  var CAMPOS = {
    auditoria: [['url','URL de la tienda','https://…',1],['redes','Redes (opcional)','@marca en Instagram'],['contexto','Contexto (opcional)','Qué le preocupa al cliente','area']],
    contenido: [['marca','Marca','',1],['rubro','Rubro','Indumentaria femenina',1],['publico','Público','Mujeres 25–40, AMBA'],['tono','Tono de marca','Cercano, canchero'],['productos','Productos destacados','',0,'area'],['objetivo','Objetivo del mes','Lanzamiento de temporada'],['mes','Mes','Diciembre 2026']],
    creativos: [['producto','Producto','',1],['oferta','Oferta','2x1 hasta el domingo'],['publico','Público',''],['diferencial','Diferencial',''],['cantidad','Cantidad de anuncios','8']],
    reporte: [['cliente','Cliente','',1],['periodo','Período','16 al 22 de noviembre'],['objetivos','Objetivos vigentes',''],['metricas','Métricas (pegá CSV o texto)','métrica, esta semana, anterior\nventas, 84, 71',1,'area']],
    diagnostico: [['marca','Marca','',1],['url','URL de la tienda','https://…',1],['rubro','Rubro','',1],['publico','Público',''],['objetivo','Objetivo del cliente',''],['redes','Redes',''],['productos','Productos destacados','',0,'area']],
    calificacion: [['nombre','Nombre','',1],['marca','Marca',''],['link','Link',''],['facturacion','Facturación',''],['problema','Problema','',0,'area']]
  };

  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'x-admin-token': TOKEN, 'content-type': 'application/json' }, opts.headers || {});
    return fetch('/api/admin' + path, opts).then(function(r){
      return r.json().then(function(j){ if (!r.ok) { var e = new Error(j.error || 'Error'); e.status = r.status; throw e; } return j; });
    });
  }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fecha(iso){ try { return new Date(iso).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}); } catch(e){ return iso; } }
  function md(texto){
    if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(texto || ''));
    return '<pre>' + esc(texto) + '</pre>';
  }

  /* ---- login ---- */
  function entrar(){
    return api('/agentes').then(function(agentes){
      $('#login').hidden = true; $('#app').hidden = false; $('#salir').hidden = false;
      $('#l-tipo').innerHTML = agentes.map(function(a){ return '<option value="'+a.id+'">'+esc(a.nombre)+'</option>'; }).join('');
      dibujarCampos(); refrescar(); setInterval(refrescar, 5000);
    });
  }
  $('#login-form').addEventListener('submit', function(e){
    e.preventDefault(); TOKEN = $('#token').value.trim();
    entrar().then(function(){ try { localStorage.setItem('escala-admin', TOKEN); } catch(e){} })
      .catch(function(err){ $('#login-err').textContent = err.message; });
  });
  $('#salir').addEventListener('click', function(){ try { localStorage.removeItem('escala-admin'); } catch(e){} location.reload(); });
  fetch('/api/estado').then(function(r){ return r.json(); }).then(function(j){ $('#modo').textContent = j.demo ? 'Modo demo' : 'Agentes reales'; }).catch(function(){});
  if (TOKEN) entrar().catch(function(){ TOKEN=''; });

  /* ---- pestañas ---- */
  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.addEventListener('click', function(){
      tab = b.getAttribute('data-tab');
      document.querySelectorAll('[data-tab]').forEach(function(x){ x.setAttribute('aria-selected', x === b); });
      document.querySelectorAll('[data-panel]').forEach(function(p){ p.hidden = p.getAttribute('data-panel') !== tab; });
      $('#grid').classList.toggle('ancho', tab === 'cartera');
    });
  });

  /* ---- datos ---- */
  function refrescar(){
    var q = []; if ($('#f-cliente').value) q.push('clienteId=' + encodeURIComponent($('#f-cliente').value)); if ($('#f-estado').value) q.push('estado=' + encodeURIComponent($('#f-estado').value));
    Promise.all([api('/leads'), api('/jobs'), api('/chats'), api('/clientes'), api('/metricas'), api('/cartera'), api('/jobs' + (q.length ? '?' + q.join('&') : ''))]).then(function(r){
      datos.leads = r[0]; datos.jobs = r[1].trabajos; datos.chats = r[2]; datos.clientes = r[3]; datos.metricas = r[4]; datos.cartera = r[5]; datos.filtrados = r[6];
      kpis(); tablaCartera(); tablaLeads(); tablaJobs(); tablaChats(); tablaClientes(); opcionesClientes();
      if (seleccion && seleccion.tipo === 'job') {
        var j = datos.jobs.find(function(x){ return x.id === seleccion.id; });
        if (j && j.estado !== seleccion.estado) verJob(j.id);
      }
    }).catch(function(err){ if (err.status === 401) location.reload(); });
  }

    var calientes = datos.leads.filter(function(l){ return l.temperatura === 'caliente'; }).length;
    $('#n-atencion').textContent = m.requieren_atencion;
    $('#kpis').innerHTML = [
      ['USD ' + m.gasto_hoy_usd.toFixed(2), 'Gasto de hoy' + (m.presupuesto_diario_usd ? ' (límite ' + m.presupuesto_diario_usd + ')' : '')],
      [m.aprobacion_automatica == null ? '—' : m.aprobacion_automatica + '%', 'Aprobadas por control de calidad' + (m.acuerdo_revisor_humano ? ' · coincide con el equipo ' + m.acuerdo_revisor_humano.porcentaje + '% (' + m.acuerdo_revisor_humano.muestras + ')' : '')],
      [m.requieren_atencion, 'Requieren atención humana'],
      [datos.cartera.clientes_activos + ' · USD ' + datos.cartera.ingreso_mensual_usd.toLocaleString('es-AR'), 'Clientes activos · ingreso mensual' + (datos.cartera.costo_ia_pct_ingreso != null ? ' · IA ' + datos.cartera.costo_ia_pct_ingreso + '%' : '')]

    return '<table><thead><tr><th>Fecha</th><th>Agente</th><th>Estado</th><th>Calidad</th><th>Costo</th></tr></thead><tbody>' +

    seleccion = { tipo:'lead', id:id }; tablaLeads();
    var trabajos = datos.jobs.filter(function(j){ return j.leadId === id; });

      '<h2 style="margin-top:18px">Etapa</h2><div class="row"><select id="etapa" style="max-width:220px">'+['nuevo','contactado','propuesta','cliente','perdido'].map(function(e){ return '<option'+(e===l.etapa?' selected':'')+'>'+e+'</option>'; }).join('')+'</select>' +
      '<button class="btn" id="auditar" type="button"'+(l.link?'':' disabled')+'>Auditar tienda</button><button class="btn" id="diag" type="button"'+(l.link?'':' disabled')+'>Diagnóstico completo</button></div>' +

    $('#etapa').addEventListener('change', function(){ api('/leads/'+id, { method:'PATCH', body: JSON.stringify({ etapa: this.value }) }).then(function(r){ refrescar(); if (r.aviso) alertaPanel(r.aviso); else if (r.cliente) alertaPanel('Cliente creado: el diagnóstico y el plan de 90 días ya están en marcha.'); }); });
    if ($('#copiar-msg')) $('#copiar-msg').addEventListener('click', function(){ copiar(l.mensaje_sugerido, $('#copiado')); });
    $('#auditar').addEventListener('click', function(){ lanzar('auditoria', { url: l.link, contexto: l.problema || '' }, id); });

  function verJob(id){
    seleccion = { tipo:'job', id:id }; tablaJobs();
    api('/jobs/'+id).then(function(j){
      seleccion.estado = j.estado;
      var cal = j.calidad ? '<div class="box"><b>Control de calidad:</b> '+(j.calidad.aprobado?'aprobado':'no aprobado')+(j.calidad.puntaje!=null?' · puntaje '+j.calidad.puntaje:'')+' · '+j.calidad.rondas+' ronda(s)'+
        ((j.revisiones||[]).filter(function(r){ return !r.aprobado; }).length ? '<ul>'+j.revisiones.filter(function(r){ return !r.aprobado; }).map(function(r){ return '<li>Ronda '+(r.ronda+1)+': '+esc((r.correcciones||[]).slice(0,4).join(' · '))+'</li>'; }).join('')+'</ul>' : '')+'</div>' : '';
      var costo = j.traza ? '<p class="muted num">'+(j.traza.pasos||[]).length+' llamadas · USD '+(j.costo_usd||0).toFixed(4)+(j.intentos>1?' · '+j.intentos+' intentos':'')+(j.versionDe?' · versión corregida':'')+'</p>' : '';
      var fb = ['listo','requiere_revision','aprobado'].indexOf(j.estado) >= 0 && j.estado !== 'aprobado' ?
        '<div class="box"><b>Tu decisión</b><textarea id="fb-txt" placeholder="Comentario (obligatorio para pedir cambios). Si el trabajo es de un cliente, queda como lección para las próximas entregas."></textarea><div class="row" style="margin-top:8px"><button class="btn primary" id="fb-ok" type="button">Aprobar</button><button class="btn" id="fb-no" type="button">Pedir cambios</button><span class="err" id="fb-err"></span></div></div>' : '';
      var cuerpo = j.resultado ? '<div class="row" style="margin-bottom:10px"><button class="btn" id="copiar-md" type="button">Copiar en markdown</button><span class="hint" id="copiado"></span></div><div class="md">'+md(j.resultado.markdown)+'</div>'
        : j.estado === 'error' ? '<p class="err">'+esc(j.error)+'</p><button class="btn" id="reintentar" type="button">Reintentar</button>'
        : j.estado === 'esperando_reintento' ? '<p class="muted">Falló por un problema transitorio ('+esc(j.error)+'). Se reintenta solo el '+fecha(j.proximoIntento)+'.</p>'
        : '<p class="muted">El agente está trabajando'+(j.progreso?': '+esc(j.progreso):'')+'… Esta vista se actualiza sola.</p>';
      var comentarios = (j.comentarios_cliente || []).length ? '<div class="box"><b>Comentarios del cliente</b><ul>'+j.comentarios_cliente.map(function(c){ return '<li>'+esc(c.texto)+' <span class="muted">· '+fecha(c.fecha)+'</span></li>'; }).join('')+'</ul><span class="hint">Si pide cambios, copiá el comentario en “Pedir cambios”.</span></div>' : '';
      if ((j.comentarios_cliente || []).some(function(c){ return !c.leido; })) api('/jobs/'+id+'/comentarios/leidos', { method:'POST' });
      $('#viewer').innerHTML = comentarios + '<h2>'+esc(j.agente)+' <span class="chip '+j.estado+'">'+j.estado.replace(/_/g,' ')+'</span></h2><p class="muted num">'+fecha(j.creado)+(j.segundos!=null?' · '+j.segundos+' s':'')+(j.origen?' · origen: '+esc(j.origen):'')+'</p>' + costo + cal + fb + (j.estado==='requiere_revision'?'<button class="btn" id="reintentar" type="button">Volver a generar</button>':'') + cuerpo;
      if ($('#copiar-md')) $('#copiar-md').addEventListener('click', function(){ copiar(j.resultado.markdown, $('#copiado')); });
      if ($('#reintentar')) $('#reintentar').addEventListener('click', function(){ api('/jobs/'+id+'/reintentar', { method:'POST' }).then(function(){ refrescar(); verJob(id); }); });
      function decidir(decision){
        api('/jobs/'+id+'/feedback', { method:'POST', body: JSON.stringify({ decision: decision, comentario: $('#fb-txt').value }) })
          .then(function(r){ refrescar(); verJob(r.nuevo ? r.nuevo.id : id); })
          .catch(function(err){ $('#fb-err').textContent = err.message; });
      }
      if ($('#fb-ok')) { $('#fb-ok').addEventListener('click', function(){ decidir('aprobar'); }); $('#fb-no').addEventListener('click', function(){ decidir('rechazar'); }); }
    });
  }

    var c = datos.chats.find(function(x){ return x.id === id; }); if (!c) return;
    seleccion = { tipo:'chat', id:id };
    $('#viewer').innerHTML = '<h2>Conversación</h2>' + c.turnos.map(function(t){ return '<p><b>'+(t.role==='user'?'Visitante':'Asesor IA')+':</b> '+esc(t.text)+'</p>'; }).join('');
  }
  function alertaPanel(texto){
    var d = document.createElement('div'); d.className = 'box'; d.setAttribute('role','status'); d.textContent = texto;
    $('#viewer').insertBefore(d, $('#viewer').firstChild);
  }
  function copiar(texto, aviso){
    try { navigator.clipboard.writeText(texto).then(function(){ aviso.textContent = 'Copiado'; }, function(){ aviso.textContent = 'No se pudo copiar'; }); } catch(e){ aviso.textContent = 'No se pudo copiar'; }
  }

  /* ---- lanzar ---- */
  function dibujarCampos(){
    var tipo = $('#l-tipo').value;
    $('#l-campos').innerHTML = (CAMPOS[tipo] || []).map(function(c){
      var id = 'f-'+c[0], req = c[3] ? ' required' : '';
      var ctrl = c[4] === 'area' ? '<textarea id="'+id+'" placeholder="'+esc(c[2])+'"'+req+'></textarea>' : '<input id="'+id+'" placeholder="'+esc(c[2])+'"'+req+'>';
      return '<label>'+esc(c[1])+ctrl+'</label>';
    }).join('');
  }
  $('#l-tipo').addEventListener('change', dibujarCampos);
  // Con un cliente elegido, los campos obligatorios se completan con su brief.
  $('#l-cliente').addEventListener('change', function(){ var con = !!this.value; $('#l-campos').querySelectorAll('input,textarea').forEach(function(i){ if (con) { i.dataset.req = i.required ? '1' : ''; i.required = false; } else if (i.dataset.req) i.required = true; }); });
  $('#nuevo-cliente').addEventListener('submit', function(e){
    e.preventDefault(); $('#c-err').textContent = '';
    var body = {}; ['marca','rubro','url','redes','publico','tono','productos','objetivo'].forEach(function(k){ body[k] = $('#c-'+k).value.trim(); });
    api('/clientes', { method:'POST', body: JSON.stringify(body) }).then(function(c){ e.target.reset(); refrescar(); setTimeout(function(){ verCliente(c.id); }, 400); }).catch(function(err){ $('#c-err').textContent = err.message; });
  });
  function lanzar(tipo, input, leadId, clienteId){
    return api('/jobs', { method:'POST', body: JSON.stringify({ tipo: tipo, input: input, leadId: leadId, clienteId: clienteId || undefined }) })
      .then(function(j){ refrescar(); document.querySelector('[data-tab="jobs"]').click(); verJob(j.id); });
  }
  $('#launch').addEventListener('submit', function(e){
    e.preventDefault(); $('#l-err').textContent = '';
    var tipo = $('#l-tipo').value, input = {};
    (CAMPOS[tipo] || []).forEach(function(c){ var v = document.getElementById('f-'+c[0]).value.trim(); if (v) input[c[0]] = v; });
    lanzar(tipo, input, undefined, $('#l-cliente').value).catch(function(err){ $('#l-err').textContent = err.message; });
  });
})();
</script>
</body>
</html>
